<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concerts | 演唱會紀錄</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons for modern UI -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0d0f12;
            color: #f3f4f6;
            background-image: radial-gradient(circle at 10% 20%, rgba(31, 38, 103, 0.15) 0%, rgba(9, 9, 12, 0.2) 90%);
        }

        /* 玻璃擬態與漸層效果 */
        .glass-panel {
            background: rgba(22, 28, 38, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .neon-border-glow:focus-within {
            border-color: #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        /* 隱藏原生滾動條，維持美觀 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #0d0f12;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3f3f46;
        }
    </style>
</head>
<body class="min-h-screen pb-16">

    <!-- 頂部導覽列 -->
    <header class="sticky top-0 z-40 w-full glass-panel border-b border-white/5 py-4 px-6 mb-8">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-purple-600 to-pink-500 p-2.5 rounded-xl shadow-lg shadow-purple-500/20">
                    <i data-lucide="music-4" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-white via-purple-200 to-purple-400">Concerts</h1>
                    <p class="text-xs text-gray-400 font-light tracking-widest">演唱會紀錄</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="exportBackup()" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium bg-white/5 hover:bg-white/10 text-gray-300 rounded-lg transition border border-white/10">
                    <i data-lucide="download" class="w-3.5 h-3.5"></i> 匯出備份
                </button>
                <label for="importFile" class="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium bg-white/5 hover:bg-white/10 text-gray-300 rounded-lg transition border border-white/10 cursor-pointer">
                    <i data-lucide="upload" class="w-3.5 h-3.5"></i> 匯入備份
                </label>
                <input type="file" id="importFile" accept=".json" class="hidden" onchange="importBackup(event)">
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6">
        
        <!-- 統計數據看版 (新增：點擊提示與點擊事件) -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
            <!-- 參戰總場次看板 -->
            <div onclick="openStatModal('artist')" 
                 class="glass-panel p-5 rounded-2xl flex items-center justify-between cursor-pointer hover:border-purple-500/40 hover:scale-[1.02] transition-all duration-300 active:scale-95 group"
                 title="點擊查看藝人參戰排行">
                <div>
                    <p class="text-xs text-gray-400 uppercase tracking-wider font-semibold flex items-center gap-1">
                        參戰總場次 
                        <i data-lucide="info" class="w-3.5 h-3.5 text-purple-400/70 group-hover:text-purple-400 transition-colors"></i>
                    </p>
                    <h3 id="statCount" class="text-3xl font-extrabold text-purple-400 mt-1">0 <span class="text-sm text-gray-400 font-normal">場</span></h3>
                </div>
                <div class="bg-purple-500/10 p-3 rounded-xl text-purple-400 group-hover:bg-purple-500/20 group-hover:scale-110 transition-all duration-300">
                    <i data-lucide="ticket" class="w-6 h-6"></i>
                </div>
            </div>
            <!-- 累積門票投資看板 -->
            <div onclick="openStatModal('price')" 
                 class="glass-panel p-5 rounded-2xl flex items-center justify-between cursor-pointer hover:border-pink-500/40 hover:scale-[1.02] transition-all duration-300 active:scale-95 group"
                 title="點擊查看最貴門票排行">
                <div>
                    <p class="text-xs text-gray-400 uppercase tracking-wider font-semibold flex items-center gap-1">
                        累積門票投資
                        <i data-lucide="info" class="w-3.5 h-3.5 text-pink-400/70 group-hover:text-pink-400 transition-colors"></i>
                    </p>
                    <h3 id="statSpent" class="text-3xl font-extrabold text-pink-400 mt-1">NT$ 0</h3>
                </div>
                <div class="bg-pink-500/10 p-3 rounded-xl text-pink-400 group-hover:bg-pink-500/20 group-hover:scale-110 transition-all duration-300">
                    <i data-lucide="banknote" class="w-6 h-6"></i>
                </div>
            </div>
            <!-- 解鎖場地數看板 -->
            <div onclick="openStatModal('venue')" 
                 class="glass-panel p-5 rounded-2xl flex items-center justify-between cursor-pointer hover:border-emerald-500/40 hover:scale-[1.02] transition-all duration-300 active:scale-95 group"
                 title="點擊查看最常去的場地">
                <div>
                    <p class="text-xs text-gray-400 uppercase tracking-wider font-semibold flex items-center gap-1">
                        解鎖場地數
                        <i data-lucide="info" class="w-3.5 h-3.5 text-emerald-400/70 group-hover:text-emerald-400 transition-colors"></i>
                    </p>
                    <h3 id="statVenues" class="text-3xl font-extrabold text-emerald-400 mt-1">0 <span class="text-sm text-gray-400 font-normal">個</span></h3>
                </div>
                <div class="bg-emerald-500/10 p-3 rounded-xl text-emerald-400 group-hover:bg-emerald-500/20 group-hover:scale-110 transition-all duration-300">
                    <i data-lucide="map-pin" class="w-6 h-6"></i>
                </div>
            </div>
        </div>

        <!-- 雙欄布局 -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <!-- 左欄：輸入表單 -->
            <div class="lg:col-span-5">
                <div class="glass-panel p-6 rounded-2xl sticky top-28 shadow-xl">
                    <div class="flex items-center gap-2 mb-6 border-b border-white/5 pb-4">
                        <i id="formIcon" data-lucide="plus-circle" class="w-5 h-5 text-purple-400"></i>
                        <h2 id="formTitle" class="text-lg font-bold text-white">新增演唱會紀錄</h2>
                    </div>

                    <form id="concertForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                        <!-- 隱藏 ID -->
                        <input type="hidden" id="editId">
                        
                        <!-- 演唱會名稱 -->
                        <div class="space-y-1.5">
                            <label for="name" class="block text-xs font-semibold text-gray-300">演唱會官方名稱</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                                    <i data-lucide="mic-2" class="w-4 h-4"></i>
                                </span>
                                <input type="text" id="name" required placeholder="例如：TWS TOUR '24/7:WITH:US'" 
                                       class="w-full bg-black/40 border border-white/10 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-gray-500 outline-none transition neon-border-glow">
                            </div>
                        </div>

                        <!-- 藝人與舉辦場地 (已排在同一行顯示) -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <!-- 藝人/團體 -->
                            <div class="space-y-1.5">
                                <label for="artist" class="block text-xs font-semibold text-gray-300">演出藝人 / 團體</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                                        <i data-lucide="users" class="w-4 h-4"></i>
                                    </span>
                                    <input type="text" id="artist" required placeholder="例如：TWS, Bruno Mars" 
                                           class="w-full bg-black/40 border border-white/10 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-gray-500 outline-none transition neon-border-glow">
                                </div>
                            </div>

                            <!-- 舉辦場地 -->
                            <div class="space-y-1.5">
                                <label for="venue" class="block text-xs font-semibold text-gray-300">活動場地</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                                        <i data-lucide="navigation" class="w-4 h-4"></i>
                                    </span>
                                    <input type="text" id="venue" required placeholder="例如：高雄流行音樂中心 海音館" 
                                           class="w-full bg-black/40 border border-white/10 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-gray-500 outline-none transition neon-border-glow">
                                </div>
                            </div>
                        </div>

                        <!-- 日期與票價 -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <!-- 日期 -->
                            <div class="space-y-1.5">
                                <label for="date" class="block text-xs font-semibold text-gray-300">舉辦日期</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                                        <i data-lucide="calendar" class="w-4 h-4"></i>
                                    </span>
                                    <input type="date" id="date" required 
                                           class="w-full bg-black/40 border border-white/10 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-gray-500 outline-none transition neon-border-glow">
                                </div>
                            </div>

                            <!-- 票價 -->
                            <div class="space-y-1.5">
                                <label for="price" class="block text-xs font-semibold text-gray-300">票價 (新台幣 TWD)</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 text-sm font-bold">
                                        $
                                    </span>
                                    <input type="number" id="price" required min="0" placeholder="例如：4800" 
                                           class="w-full bg-black/40 border border-white/10 rounded-xl py-2.5 pl-8 pr-4 text-sm text-white placeholder-gray-500 outline-none transition neon-border-glow">
                                </div>
                            </div>
                        </div>

                        <!-- 主題圖片上傳 -->
                        <div class="space-y-1.5">
                            <label class="block text-xs font-semibold text-gray-300">演唱會官方主題圖片 (海報)</label>
                            <div class="grid grid-cols-12 gap-3 items-center">
                                <!-- 預覽容器 (16:9) -->
                                <div class="col-span-4">
                                    <div class="aspect-video rounded-lg border border-white/10 bg-black/50 overflow-hidden flex items-center justify-center relative group">
                                        <img id="imagePreview" src="" alt="海報預覽" class="w-full h-full object-cover hidden">
                                        <div id="imagePlaceholder" class="text-gray-500 flex flex-col items-center">
                                            <i data-lucide="image" class="w-5 h-5"></i>
                                        </div>
                                    </div>
                                </div>
                                <!-- 上傳按鈕與說明 -->
                                <div class="col-span-8 space-y-1.5">
                                    <label class="block w-full text-center py-2 px-3 border border-dashed border-white/20 hover:border-purple-500/50 rounded-xl bg-black/20 hover:bg-purple-500/5 transition cursor-pointer text-xs font-medium text-gray-300">
                                        <span>選擇官方主視覺圖片檔案</span>
                                        <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="previewImage(event)">
                                    </label>
                                    <p class="text-[10px] text-gray-400 leading-normal">建議比例 16:9 (橫向)。若未上傳，系統將自動生成專屬幾何音樂封面。</p>
                                </div>
                            </div>
                        </div>

                        <!-- 按鈕區 -->
                        <div class="flex gap-2 pt-2">
                            <button type="submit" id="submitBtn" class="flex-1 bg-gradient-to-r from-purple-600 to-pink-500 hover:from-purple-500 hover:to-pink-400 text-white font-semibold py-2.5 rounded-xl transition shadow-lg shadow-purple-500/20 text-sm">
                                儲存紀錄
                            </button>
                            <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden px-4 bg-white/10 hover:bg-white/15 text-gray-300 font-semibold py-2.5 rounded-xl transition text-sm">
                                取消
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <!-- 右欄：過濾器與列表 -->
            <div class="lg:col-span-7 space-y-6">
                
                <!-- 搜尋、排序控制面板 -->
                <div class="glass-panel p-4 rounded-2xl flex flex-col sm:flex-row gap-4 items-center justify-between">
                    <!-- 搜尋 -->
                    <div class="relative w-full sm:w-64">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i data-lucide="search" class="w-4 h-4"></i>
                        </span>
                        <input type="text" id="searchInput" oninput="filterAndRender()" placeholder="搜尋名稱、歌手藝人或場地..." 
                               class="w-full bg-black/40 border border-white/10 rounded-xl py-2 pl-9 pr-4 text-xs text-white placeholder-gray-500 outline-none transition neon-border-glow">
                    </div>

                    <!-- 排序 & 篩選 -->
                    <div class="flex gap-2 w-full sm:w-auto">
                        <select id="sortSelect" onchange="filterAndRender()" 
                                class="flex-1 sm:flex-initial bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs text-gray-300 outline-none transition focus:border-purple-500">
                            <option value="date-desc">日期由新到舊</option>
                            <option value="date-asc">日期由舊到新</option>
                            <option value="price-desc">票價由高到低</option>
                            <option value="price-asc">票價由低到高</option>
                        </select>
                    </div>
                </div>

                <!-- 演唱會海報牆列表 (16:9 比例) -->
                <div id="concertWall" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- 經由 JS 產生的海報卡片 -->
                </div>

                <!-- 空狀態提示 -->
                <div id="emptyState" class="hidden glass-panel p-12 rounded-2xl text-center space-y-4">
                    <div class="w-16 h-16 bg-white/5 rounded-full flex items-center justify-center mx-auto text-gray-500">
                        <i data-lucide="disc" class="w-8 h-8 animate-spin-slow"></i>
                    </div>
                    <div>
                        <h3 class="text-base font-semibold text-gray-200">目前沒有演唱會紀錄</h3>
                        <p class="text-xs text-gray-500 mt-1">立刻在左側表單中填入你的第一場參戰紀錄吧！</p>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <!-- 統計數據詳情彈出視窗 (Modal) -->
    <div id="statModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm opacity-0 pointer-events-none transition-all duration-300">
        <div class="glass-panel p-6 rounded-3xl max-w-md w-full mx-4 space-y-4 border border-purple-500/20 shadow-2xl flex flex-col max-h-[85vh] transform scale-95 transition-transform duration-300">
            <!-- 視窗頭部 -->
            <div class="flex items-center justify-between border-b border-white/5 pb-3.5">
                <div class="flex items-center gap-3">
                    <div id="statModalIcon" class="p-2.5 rounded-xl bg-purple-500/10 text-purple-400 shadow-inner">
                        <i data-lucide="award" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h3 id="statModalTitle" class="text-base font-bold text-white">排行分析統計</h3>
                        <p id="statModalSubtitle" class="text-[10px] text-gray-400 mt-0.5">點擊各看板可深入分析數據</p>
                    </div>
                </div>
                <button onclick="closeStatModal()" class="p-1.5 bg-white/5 hover:bg-white/10 rounded-lg text-gray-400 hover:text-white transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            
            <!-- 排行榜容器 -->
            <div id="statModalContent" class="overflow-y-auto pr-1 space-y-2.5 flex-1 scrollbar-thin">
                <!-- 動態生成的列表會在此渲染 -->
            </div>
            
            <!-- 關閉按鈕 -->
            <div class="flex justify-end pt-3 border-t border-white/5">
                <button onclick="closeStatModal()" class="px-5 py-2.5 bg-gradient-to-tr from-purple-600/80 to-pink-500/80 hover:from-purple-500 hover:to-pink-400 text-white rounded-xl text-xs font-semibold shadow-lg shadow-purple-500/10 transition active:scale-95">
                    我知道了
                </button>
            </div>
        </div>
    </div>

    <!-- 自訂刪除確認 Modal -->
    <div id="deleteModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="glass-panel p-6 rounded-2xl max-w-sm w-full mx-4 space-y-4 border border-red-500/20">
            <div class="flex items-center gap-3 text-red-400">
                <div class="p-2 bg-red-500/10 rounded-lg">
                    <i data-lucide="alert-triangle" class="w-6 h-6"></i>
                </div>
                <h3 class="text-base font-bold text-white">確定要刪除這筆紀錄嗎？</h3>
            </div>
            <p class="text-xs text-gray-400 leading-relaxed">
                你將永久移除 <span id="deleteTargetName" class="text-white font-semibold"></span> 的參戰海報與所有相關紀錄，此動作無法復原。
            </p>
            <div class="flex gap-2 justify-end pt-2">
                <button onclick="closeDeleteModal()" class="px-4 py-2 bg-white/5 hover:bg-white/10 text-gray-300 rounded-xl text-xs transition">
                    保留
                </button>
                <button id="confirmDeleteBtn" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs transition font-semibold shadow-lg shadow-red-500/10">
                    確定刪除
                </button>
            </div>
        </div>
    </div>

    <!-- 提示框系統 (Toast Notification) -->
    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 space-y-2"></div>

    <script>
        // 初始化 state
        let concerts = [];
        let activeEditImageBase64 = ''; // 編輯暫存 Base64 圖片
        let deleteTargetId = null;

        // 16:9 自動生成漸層海報 (當使用者不上傳時，自動繪製有質感的漸層黑膠封面)
        function generateDefaultPoster(name, date) {
            const colors = [
                ['#3b82f6', '#8b5cf6'], // 藍紫
                ['#ec4899', '#f43f5e'], // 粉紅
                ['#a855f7', '#ec4899'], // 紫粉
                ['#06b6d4', '#3b82f6'], // 藍綠
                ['#10b981', '#059669'], // 綠
                ['#f59e0b', '#d97706']  // 橘
            ];
            // 隨機選一個漸層
            const codeSum = name.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
            const selectedColor = colors[codeSum % colors.length];
            
            return `data:image/svg+xml;utf8,<svg width="400" height="225" viewBox="0 0 400 225" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${selectedColor[0]}"/><stop offset="100%" stop-color="${selectedColor[1]}"/></linearGradient></defs><rect width="400" height="225" fill="url(%23g)"/><circle cx="320" cy="112.5" r="90" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="12"/><circle cx="320" cy="112.5" r="70" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4"/><circle cx="320" cy="112.5" r="50" fill="rgba(0,0,0,0.3)"/><circle cx="320" cy="112.5" r="12" fill="%23fff"/><g transform="translate(24, 90)" fill="%23ffffff"><text font-family="system-ui, sans-serif" font-weight="900" font-size="20" y="0" opacity="0.95">${escapeSvg(name.substring(0, 22))}</text><text font-family="system-ui, sans-serif" font-weight="700" font-size="11" y="24" opacity="0.6" letter-spacing="1">LIVE CONCERT TOUR</text><text font-family="system-ui, sans-serif" font-weight="400" font-size="10" y="42" opacity="0.45">${date}</text></g></svg>`;
        }

        function escapeSvg(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&apos;");
        }

        // 生命週期初始化
        window.addEventListener('DOMContentLoaded', () => {
            // 從 LocalStorage 載入資料
            const stored = localStorage.getItem('user_concert_archives');
            if (stored) {
                try {
                    concerts = JSON.parse(stored);
                } catch(e) {
                    concerts = [];
                }
            }
            lucide.createIcons();
            filterAndRender();
        });

        // 圖片預覽處理
        function previewImage(event) {
            const file = event.target.files[0];
            const preview = document.getElementById('imagePreview');
            const placeholder = document.getElementById('imagePlaceholder');
            
            if (file) {
                // 限制 3MB 以內防 LocalStorage 爆掉
                if (file.size > 3 * 1024 * 1024) {
                    showToast('圖片檔案太大，請壓縮至 3MB 以下！', 'error');
                    event.target.value = '';
                    return;
                }

                const reader = new FileReader();
                reader.onload = function(e) {
                    activeEditImageBase64 = e.target.result;
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        // 新增與編輯資料送出
        function handleFormSubmit(event) {
            event.preventDefault();
            
            const editId = document.getElementById('editId').value;
            const name = document.getElementById('name').value.trim();
            const artist = document.getElementById('artist').value.trim();
            const date = document.getElementById('date').value;
            const price = parseInt(document.getElementById('price').value) || 0;
            const venue = document.getElementById('venue').value.trim();

            if (editId) {
                // 編輯既存項目
                const idx = concerts.findIndex(c => c.id == editId);
                if (idx !== -1) {
                    // 若有上傳新圖使用新圖，否則保留原先圖片
                    const finalImage = activeEditImageBase64 || concerts[idx].image;
                    concerts[idx] = {
                        ...concerts[idx],
                        name,
                        artist,
                        date,
                        price,
                        venue,
                        image: finalImage
                    };
                    showToast('已更新典藏紀錄', 'success');
                }
            } else {
                // 新建項目
                const newRecord = {
                    id: Date.now(),
                    name,
                    artist,
                    date,
                    price,
                    venue,
                    image: activeEditImageBase64 // 未上傳時為空字串，渲染時會用 SVG 補上
                };
                concerts.push(newRecord);
                showToast('已新增參戰典藏', 'success');
            }

            // 儲存、重設與更新
            saveToStorage();
            resetForm();
            filterAndRender();
        }

        // 觸發編輯模式
        function startEdit(id) {
            const concert = concerts.find(c => c.id === id);
            if (!concert) return;

            // 滾動回頂端
            window.scrollTo({ top: 0, behavior: 'smooth' });

            document.getElementById('editId').value = concert.id;
            document.getElementById('name').value = concert.name;
            document.getElementById('artist').value = concert.artist || '';
            document.getElementById('date').value = concert.date;
            document.getElementById('price').value = concert.price;
            document.getElementById('venue').value = concert.venue;

            // 圖片預覽處理
            const preview = document.getElementById('imagePreview');
            const placeholder = document.getElementById('imagePlaceholder');
            
            if (concert.image) {
                preview.src = concert.image;
                preview.classList.remove('hidden');
                placeholder.classList.add('hidden');
                activeEditImageBase64 = concert.image;
            } else {
                preview.classList.add('hidden');
                placeholder.classList.remove('hidden');
                activeEditImageBase64 = '';
            }

            // 切換 UI 標題
            document.getElementById('formTitle').textContent = '編輯典藏資訊';
            document.getElementById('formIcon').setAttribute('data-lucide', 'edit-3');
            document.getElementById('submitBtn').textContent = '更新典藏';
            document.getElementById('cancelBtn').classList.remove('hidden');
            
            lucide.createIcons();
        }

        // 開啟刪除確認視窗
        function askDelete(id, name) {
            deleteTargetId = id;
            document.getElementById('deleteTargetName').textContent = name;
            
            const modal = document.getElementById('deleteModal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.querySelector('.glass-panel').classList.add('scale-100');
        }

        function closeDeleteModal() {
            const modal = document.getElementById('deleteModal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            deleteTargetId = null;
        }

        // 確定執行刪除
        document.getElementById('confirmDeleteBtn').addEventListener('click', () => {
            if (deleteTargetId) {
                concerts = concerts.filter(c => c.id !== deleteTargetId);
                saveToStorage();
                filterAndRender();
                showToast('已刪除典藏項目', 'success');
            }
            closeDeleteModal();
        });

        // 重設表單
        function resetForm() {
            document.getElementById('concertForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('imagePreview').classList.add('hidden');
            document.getElementById('imagePlaceholder').classList.remove('hidden');
            document.getElementById('imageInput').value = '';
            activeEditImageBase64 = '';

            document.getElementById('formTitle').textContent = '新增演唱會典藏';
            document.getElementById('formIcon').setAttribute('data-lucide', 'plus-circle');
            document.getElementById('submitBtn').textContent = '儲存紀錄';
            document.getElementById('cancelBtn').classList.add('hidden');
            
            lucide.createIcons();
        }

        // 過濾、排序與渲染
        function filterAndRender() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            const sortBy = document.getElementById('sortSelect').value;

            // 1. 過濾 (增加搜尋藝人欄位)
            let filtered = concerts.filter(c => {
                return c.name.toLowerCase().includes(searchQuery) || 
                       (c.artist && c.artist.toLowerCase().includes(searchQuery)) ||
                       c.venue.toLowerCase().includes(searchQuery);
            });

            // 2. 排序
            filtered.sort((a, b) => {
                if (sortBy === 'date-desc') {
                    return new Date(b.date) - new Date(a.date);
                } else if (sortBy === 'date-asc') {
                    return new Date(a.date) - new Date(b.date);
                } else if (sortBy === 'price-desc') {
                    return b.price - a.price;
                } else if (sortBy === 'price-asc') {
                    return a.price - b.price;
                }
                return 0;
            });

            // 3. 渲染牆面 (16:9)
            const wall = document.getElementById('concertWall');
            const emptyState = document.getElementById('emptyState');
            wall.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                filtered.forEach(item => {
                    const posterSrc = item.image || generateDefaultPoster(item.name, item.date);
                    
                    const card = document.createElement('div');
                    card.className = 'glass-panel rounded-2xl overflow-hidden hover:border-purple-500/30 transition-all duration-300 flex flex-col group';
                    
                    card.innerHTML = `
                        <!-- 海報區 (16:9 比例) -->
                        <div class="relative aspect-video bg-black/60 overflow-hidden w-full">
                            <img src="${posterSrc}" alt="${item.name} 主視覺海報" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                            <!-- 遮罩操作按鈕 -->
                            <div class="absolute inset-0 bg-gradient-to-t from-black/90 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 flex items-end justify-between p-4">
                                <span class="text-[10px] text-gray-300 bg-black/60 backdrop-blur px-2.5 py-1 rounded-full border border-white/5 flex items-center gap-1">
                                    <i data-lucide="map-pin" class="w-3 h-3 text-pink-400"></i> ${item.venue.substring(0, 10)}${item.venue.length > 10 ? '...' : ''}
                                </span>
                                <div class="flex gap-1.5">
                                    <button onclick="startEdit(${item.id})" class="p-1.5 bg-purple-600 hover:bg-purple-500 text-white rounded-lg transition" title="編輯">
                                        <i data-lucide="edit-3" class="w-4 h-4"></i>
                                    </button>
                                    <button onclick="askDelete(${item.id}, '${item.name}')" class="p-1.5 bg-red-600 hover:bg-red-500 text-white rounded-lg transition" title="刪除">
                                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                        
                        <!-- 資訊區 (已更改場地顯示：[藝人][場地]) -->
                        <div class="p-4 flex-1 flex flex-col justify-between">
                            <div class="space-y-1">
                                <div class="flex justify-between items-start gap-1">
                                    <span class="text-[10px] font-mono tracking-wider text-purple-400 bg-purple-500/10 px-2 py-0.5 rounded-md">${item.date}</span>
                                    <span class="text-[11px] font-semibold text-pink-400 font-mono">NT$ ${item.price.toLocaleString()}</span>
                                </div>
                                <h3 class="font-bold text-sm text-gray-100 group-hover:text-purple-300 transition line-clamp-2 pt-1" title="${item.name}">${item.name}</h3>
                            </div>
                            <div class="pt-3 border-t border-white/5 mt-3 flex justify-between items-center text-[11px] text-gray-400">
                                <span class="flex items-center gap-1 truncate max-w-[85%]" title="[${item.artist || '未填'}] ${item.venue}">
                                    <i data-lucide="map-pin" class="w-3.5 h-3.5 text-gray-500 shrink-0"></i> 
                                    <span class="text-purple-400 font-bold shrink-0 mr-1">[${item.artist || '未填'}]</span> 
                                    <span class="truncate">${item.venue}</span>
                                </span>
                                <div class="flex gap-2 sm:hidden group-hover:block transition">
                                    <button onclick="startEdit(${item.id})" class="text-purple-400 hover:text-purple-300 font-medium">編輯</button>
                                </div>
                            </div>
                        </div>
                    `;
                    wall.appendChild(card);
                });
            }

            updateStats();
            lucide.createIcons();
        }

        // 更新統計看板
        function updateStats() {
            const count = concerts.length;
            const spent = concerts.reduce((sum, item) => sum + item.price, 0);
            
            // 獨立場地數
            const venuesSet = new Set(concerts.map(c => c.venue.trim().toLowerCase()));
            const venuesCount = venuesSet.size;

            document.getElementById('statCount').innerHTML = `${count} <span class="text-sm text-gray-400 font-normal">場</span>`;
            document.getElementById('statSpent').textContent = `NT$ ${spent.toLocaleString()}`;
            document.getElementById('statVenues').innerHTML = `${venuesCount} <span class="text-sm text-gray-400 font-normal">個</span>`;
        }

        // 開啟各統計數據彈出排行榜
        function openStatModal(type) {
            if (concerts.length === 0) {
                showToast('目前典藏館中沒有任何演唱會資料，請先新增紀錄！', 'error');
                return;
            }

            const titleEl = document.getElementById('statModalTitle');
            const iconContainer = document.getElementById('statModalIcon');
            const contentEl = document.getElementById('statModalContent');
            contentEl.innerHTML = ''; // 清空先前的項目

            let modalTitle = '';
            let iconName = 'bar-chart-2';
            let iconColorClass = 'text-purple-400 bg-purple-500/10';

            // 1. 參戰總場次：顯示哪一位藝人的演唱會參加最多次，以多到少排序
            if (type === 'artist') {
                modalTitle = '參戰藝人熱度排行榜';
                iconName = 'users';
                iconColorClass = 'text-purple-400 bg-purple-500/10';

                // 計算藝人場次數
                const artistCounts = {};
                concerts.forEach(c => {
                    const key = c.artist ? c.artist.trim() : '未填藝人';
                    artistCounts[key] = (artistCounts[key] || 0) + 1;
                });

                // 排序
                const sortedArtists = Object.entries(artistCounts).sort((a, b) => b[1] - a[1]);

                // 渲染排行列表
                sortedArtists.forEach(([artist, num], index) => {
                    const rankBadge = getRankBadge(index + 1);
                    const row = document.createElement('div');
                    row.className = 'flex items-center justify-between p-3.5 rounded-2xl bg-white/5 border border-white/5 hover:border-purple-500/20 transition-all duration-300';
                    row.innerHTML = `
                        <div class="flex items-center gap-3 min-w-0">
                            ${rankBadge}
                            <span class="text-sm font-bold text-white truncate">${escapeHtml(artist)}</span>
                        </div>
                        <span class="text-xs font-bold text-purple-400 bg-purple-500/10 px-3 py-1 rounded-full shrink-0">${num} 場</span>
                    `;
                    contentEl.appendChild(row);
                });
            } 
            // 2. 累積門票投資：顯示哪一場演唱會門票最貴，以貴到便宜排序
            else if (type === 'price') {
                modalTitle = '門票消費最高排行榜';
                iconName = 'banknote';
                iconColorClass = 'text-pink-400 bg-pink-500/10';

                // 複製陣列排序 (貴到便宜)
                const sortedConcerts = [...concerts].sort((a, b) => b.price - a.price);

                sortedConcerts.forEach((c, index) => {
                    const rankBadge = getRankBadge(index + 1);
                    const row = document.createElement('div');
                    row.className = 'flex items-center justify-between p-3.5 rounded-2xl bg-white/5 border border-white/5 hover:border-pink-500/20 transition-all duration-300 gap-4';
                    row.innerHTML = `
                        <div class="flex items-center gap-3 min-w-0 flex-1">
                            ${rankBadge}
                            <div class="min-w-0 flex-1">
                                <p class="text-sm font-bold text-white truncate" title="${c.name}">${escapeHtml(c.name)}</p>
                                <p class="text-[10px] text-gray-400 mt-0.5 truncate">
                                    <span class="text-purple-400 font-medium">[${escapeHtml(c.artist || '未填')}]</span> ${escapeHtml(c.venue)} (${c.date})
                                </p>
                            </div>
                        </div>
                        <span class="text-xs font-mono font-bold text-pink-400 bg-pink-500/10 px-3 py-1 rounded-full shrink-0">NT$ ${c.price.toLocaleString()}</span>
                    `;
                    contentEl.appendChild(row);
                });
            } 
            // 3. 解鎖場地數：顯示哪一個場地參加最多次，以多到少排序
            else if (type === 'venue') {
                modalTitle = '活動場地造訪足跡排行榜';
                iconName = 'map-pin';
                iconColorClass = 'text-emerald-400 bg-emerald-500/10';

                // 計算場地次數
                const venueCounts = {};
                concerts.forEach(c => {
                    const key = c.venue ? c.venue.trim() : '未知場地';
                    venueCounts[key] = (venueCounts[key] || 0) + 1;
                });

                // 排序
                const sortedVenues = Object.entries(venueCounts).sort((a, b) => b[1] - a[1]);

                sortedVenues.forEach(([venue, num], index) => {
                    const rankBadge = getRankBadge(index + 1);
                    const row = document.createElement('div');
                    row.className = 'flex items-center justify-between p-3.5 rounded-2xl bg-white/5 border border-white/5 hover:border-emerald-500/20 transition-all duration-300';
                    row.innerHTML = `
                        <div class="flex items-center gap-3 min-w-0">
                            ${rankBadge}
                            <span class="text-sm font-bold text-white truncate" title="${venue}">${escapeHtml(venue)}</span>
                        </div>
                        <span class="text-xs font-bold text-emerald-400 bg-emerald-500/10 px-3 py-1 rounded-full shrink-0">${num} 次</span>
                    `;
                    contentEl.appendChild(row);
                });
            }

            // 更新彈出窗標題與圖示
            titleEl.textContent = modalTitle;
            iconContainer.className = `p-2.5 rounded-xl ${iconColorClass} shadow-inner`;
            iconContainer.innerHTML = `<i data-lucide="${iconName}" class="w-5 h-5"></i>`;

            // 動態顯示
            const modal = document.getElementById('statModal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
            modal.querySelector('.glass-panel').classList.remove('scale-95');
            modal.querySelector('.glass-panel').classList.add('scale-100');

            lucide.createIcons();
        }

        // 關閉統計數據彈出窗
        function closeStatModal() {
            const modal = document.getElementById('statModal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            modal.querySelector('.glass-panel').classList.remove('scale-100');
            modal.querySelector('.glass-panel').classList.add('scale-95');
        }

        // 取得精美排行勳章 HTML
        function getRankBadge(rank) {
            if (rank === 1) {
                return `<span class="flex items-center justify-center w-6 h-6 rounded-lg bg-yellow-500/20 text-yellow-400 border border-yellow-500/30 text-xs font-black shrink-0 shadow-sm shadow-yellow-500/10">1</span>`;
            }
            if (rank === 2) {
                return `<span class="flex items-center justify-center w-6 h-6 rounded-lg bg-slate-300/20 text-slate-300 border border-slate-300/30 text-xs font-black shrink-0">2</span>`;
            }
            if (rank === 3) {
                return `<span class="flex items-center justify-center w-6 h-6 rounded-lg bg-amber-700/20 text-amber-500 border border-amber-700/30 text-xs font-black shrink-0">3</span>`;
            }
            return `<span class="flex items-center justify-center w-6 h-6 rounded-lg bg-white/5 text-gray-500 border border-white/10 text-xs font-semibold shrink-0">${rank}</span>`;
        }

        // 防 XSS 字串跳脫
        function escapeHtml(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        // 存檔至 Local Storage
        function saveToStorage() {
            localStorage.setItem('user_concert_archives', JSON.stringify(concerts));
        }

        // 匯出備份 (JSON)
        function exportBackup() {
            if (concerts.length === 0) {
                showToast('目前沒有資料可以匯出', 'error');
                return;
            }
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(concerts, null, 2));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `LiveArchive_Backup_${new Date().toISOString().slice(0,10)}.json`);
            dlAnchorElem.click();
            showToast('備份檔案已成功導出！', 'success');
        }

        // 匯入備份 (JSON)
        function importBackup(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const parsed = JSON.parse(e.target.result);
                    if (Array.isArray(parsed)) {
                        concerts = parsed;
                        saveToStorage();
                        filterAndRender();
                        showToast('成功匯入備份數據！', 'success');
                    } else {
                        showToast('匯入失敗：格式不正確', 'error');
                    }
                } catch (err) {
                    showToast('匯入失敗：非有效的 JSON 檔案', 'error');
                }
            };
            reader.readAsText(file);
            event.target.value = ''; // 重置 input 狀態
        }

        // Toast 訊息系統
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `flex items-center gap-2 px-4 py-3 rounded-xl shadow-2xl border transition-all duration-300 transform translate-y-2 opacity-0 text-sm font-medium ${
                type === 'success' 
                ? 'bg-purple-950/80 text-purple-200 border-purple-500/30' 
                : 'bg-red-950/80 text-red-200 border-red-500/30'
            }`;
            
            const icon = type === 'success' ? 'check-circle' : 'alert-circle';
            toast.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4 shrink-0"></i> <span>${message}</span>`;
            
            container.appendChild(toast);
            lucide.createIcons();

            // 動態滑入
            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            // 自動淡出銷毀
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-1');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 3000);
        }
    </script>
</body>
</html>
