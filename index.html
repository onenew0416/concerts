<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concerts | 演唱會紀錄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #0d0f12;
            color: #f3f4f6;
            background-image: radial-gradient(circle at 10% 20%, rgba(31, 38, 103, 0.15) 0%, rgba(9, 9, 12, 0.2) 90%);
        }

        .glass-panel {
            background: rgba(22, 28, 38, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .neon-border-glow:focus-within {
            border-color: #a855f7;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.3);
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0d0f12; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }
    </style>
</head>
<body class="min-h-screen pb-16">

    <header class="sticky top-0 z-40 w-full glass-panel border-b border-white/5 py-4 px-6 mb-8">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-gradient-to-tr from-purple-600 to-pink-500 p-2.5 rounded-xl shadow-lg shadow-purple-500/20">
                    <i data-lucide="music-4" class="w-6 h-6 text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-white via-purple-200 to-purple-400">CONCERTS</h1>
                    <p class="text-xs text-gray-400 font-light tracking-widest">演唱會紀錄</p>
                </div>
            </div>
            
            <div class="text-xs text-gray-400 bg-white/5 border border-white/10 px-3 py-1.5 rounded-xl flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span> 雲端資料庫已連線
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6">
        
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-8">
            <div onclick="openStatsModal('artist')" class="glass-panel p-5 rounded-2xl flex items-center justify-between cursor-pointer hover:border-purple-500/40 hover:bg-purple-500/5 transition group duration-300">
                <div>
                    <p class="text-xs text-gray-400 uppercase tracking-wider font-semibold group-hover:text-purple-300 transition">參戰總場次 (點擊分析)</p>
                    <h3 id="statCount" class="text-3xl font-extrabold text-purple-400 mt-1">0 <span class="text-sm text-gray-400 font-normal">場</span></h3>
                </div>
                <div class="bg-purple-500/10 p-3 rounded-xl text-purple-400 group-hover:scale-110 transition">
                    <i data-lucide="ticket" class="w-6 h-6"></i>
                </div>
            </div>
            <div onclick="openStatsModal('price')" class="glass-panel p-5 rounded-2xl flex items-center justify-between cursor-pointer hover:border-pink-500/40 hover:bg-pink-500/5 transition group duration-300">
                <div>
                    <p class="text-xs text-gray-400 uppercase tracking-wider font-semibold group-hover:text-pink-300 transition">累積門票投資 (點擊排行)</p>
                    <h3 id="statSpent" class="text-3xl font-extrabold text-pink-400 mt-1">NT$ 0</h3>
                </div>
                <div class="bg-pink-500/10 p-3 rounded-xl text-pink-400 group-hover:scale-110 transition">
                    <i data-lucide="banknote" class="w-6 h-6"></i>
                </div>
            </div>
            <div onclick="openStatsModal('venue')" class="glass-panel p-5 rounded-2xl flex items-center justify-between cursor-pointer hover:border-emerald-500/40 hover:bg-emerald-500/5 transition group duration-300">
                <div>
                    <p class="text-xs text-gray-400 uppercase tracking-wider font-semibold group-hover:text-emerald-300 transition">解鎖場地數 (點擊造訪榜)</p>
                    <h3 id="statVenues" class="text-3xl font-extrabold text-emerald-400 mt-1">0 <span class="text-sm text-gray-400 font-normal">個</span></h3>
                </div>
                <div class="bg-emerald-500/10 p-3 rounded-xl text-emerald-400 group-hover:scale-110 transition">
                    <i data-lucide="map-pin" class="w-6 h-6"></i>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">
            
            <div class="lg:col-span-5">
                <div class="glass-panel p-6 rounded-2xl sticky top-28 shadow-xl">
                    <div class="flex items-center gap-2 mb-6 border-b border-white/5 pb-4">
                        <i id="formIcon" data-lucide="plus-circle" class="w-5 h-5 text-purple-400"></i>
                        <h2 id="formTitle" class="text-lg font-bold text-white">新增演唱會紀錄</h2>
                    </div>

                    <form id="concertForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                        <input type="hidden" id="editId">
                        <input type="hidden" id="existingImage">
                        
                        <div class="space-y-1.5">
                            <label for="name" class="block text-xs font-semibold text-gray-300">演唱會官方名稱</label>
                            <div class="relative">
                                <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                                    <i data-lucide="mic-2" class="w-4 h-4"></i>
                                </span>
                                <input type="text" id="name" required placeholder="例如：TWS TOUR '24/7:WITH:US'" 
                                       class="w-full bg-black/40 border border-white/10 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-gray-500 outline-none transition neon-border-glow">
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="space-y-1.5">
                                <label for="date" class="block text-xs font-semibold text-gray-300">舉辦日期</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                                        <i data-lucide="calendar" class="w-4 h-4"></i>
                                    </span>
                                    <input type="date" id="date" required 
                                           class="w-full bg-black/40 border border-white/10 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-gray-500 outline-none transition neon-border-glow">
                                </div>
                            </div>

                            <div class="space-y-1.5">
                                <label for="price" class="block text-xs font-semibold text-gray-300">票價 (新台幣 TWD)</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 text-sm font-bold">$</span>
                                    <input type="number" id="price" required min="0" placeholder="例如：4800" 
                                           class="w-full bg-black/40 border border-white/10 rounded-xl py-2.5 pl-8 pr-4 text-sm text-white placeholder-gray-500 outline-none transition neon-border-glow">
                                </div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <div class="space-y-1.5">
                                <label for="artist" class="block text-xs font-semibold text-gray-300">藝人 / 團體</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                                        <i data-lucide="users" class="w-4 h-4"></i>
                                    </span>
                                    <input type="text" id="artist" required placeholder="例如：TWS" 
                                           class="w-full bg-black/40 border border-white/10 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-gray-500 outline-none transition neon-border-glow">
                                </div>
                            </div>

                            <div class="space-y-1.5">
                                <label for="venue" class="block text-xs font-semibold text-gray-300">活動場地</label>
                                <div class="relative">
                                    <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                                        <i data-lucide="navigation" class="w-4 h-4"></i>
                                    </span>
                                    <input type="text" id="venue" required placeholder="例如：高雄流行音樂中心" 
                                           class="w-full bg-black/40 border border-white/10 rounded-xl py-2.5 pl-10 pr-4 text-sm text-white placeholder-gray-500 outline-none transition neon-border-glow">
                                </div>
                            </div>
                        </div>

                        <div class="space-y-1.5">
                            <label class="block text-xs font-semibold text-gray-300">演唱會官方主題海報</label>
                            <div class="grid grid-cols-12 gap-3 items-center">
                                <div class="col-span-4">
                                    <div class="aspect-[16/9] rounded-lg border border-white/10 bg-black/50 overflow-hidden flex items-center justify-center relative">
                                        <img id="imagePreview" src="" alt="海報預覽" class="w-full h-full object-cover hidden">
                                        <div id="imagePlaceholder" class="text-gray-500 flex flex-col items-center">
                                            <i data-lucide="image" class="w-4 h-4"></i>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-span-8 space-y-1.5">
                                    <label class="block w-full text-center py-2 px-3 border border-dashed border-white/20 hover:border-purple-500/50 rounded-xl bg-black/20 hover:bg-purple-500/5 transition cursor-pointer text-xs font-medium text-gray-300">
                                        <span>選擇官方主視覺海報</span>
                                        <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="previewImage(event)">
                                    </label>
                                    <p class="text-[10px] text-gray-400 leading-normal">智慧壓縮技術：大圖自動維持比例壓縮，完美避開雲端容量限制。</p>
                                </div>
                            </div>
                        </div>

                        <div class="flex gap-2 pt-2">
                            <button type="submit" id="submitBtn" class="flex-1 bg-gradient-to-r from-purple-600 to-pink-500 hover:from-purple-500 hover:to-pink-400 text-white font-semibold py-2.5 rounded-xl transition shadow-lg shadow-purple-500/20 text-sm flex items-center justify-center gap-2">
                                <span>儲存紀錄</span>
                            </button>
                            <button type="button" id="cancelBtn" onclick="resetForm()" class="hidden px-4 bg-white/10 hover:bg-white/15 text-gray-300 font-semibold py-2.5 rounded-xl transition text-sm">
                                取消
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-7 space-y-6">
                <div class="glass-panel p-4 rounded-2xl flex flex-col sm:flex-row gap-4 items-center justify-between">
                    <div class="relative w-full sm:w-64">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400">
                            <i data-lucide="search" class="w-4 h-4"></i>
                        </span>
                        <input type="text" id="searchInput" oninput="filterAndRender()" placeholder="搜尋名稱、藝人或場地..." 
                               class="w-full bg-black/40 border border-white/10 rounded-xl py-2 pl-9 pr-4 text-xs text-white placeholder-gray-500 outline-none transition neon-border-glow">
                    </div>
                    <div class="flex gap-2 w-full sm:w-auto">
                        <select id="sortSelect" onchange="filterAndRender()" 
                                class="flex-1 sm:flex-initial bg-black/40 border border-white/10 rounded-xl px-3 py-2 text-xs text-gray-300 outline-none transition focus:border-purple-500">
                            <option value="date-desc">日期由新到舊</option>
                            <option value="date-asc">日期由舊到新</option>
                            <option value="price-desc">票價由高到低</option>
                            <option value="price-asc">票價由低到高</option>
                        </select>
                    </div>
                </div>

                <div id="concertWall" class="grid grid-cols-1 gap-4">
                    </div>

                <div id="emptyState" class="hidden glass-panel p-12 rounded-2xl text-center space-y-4">
                    <div class="w-16 h-16 bg-white/5 rounded-full flex items-center justify-center mx-auto text-gray-500">
                        <i data-lucide="disc" class="w-8 h-8"></i>
                    </div>
                    <div>
                        <h3 class="text-base font-semibold text-gray-200">目前雲端沒有任何紀錄</h3>
                        <p class="text-xs text-gray-500 mt-1">在左側填表，資料會直接同步至 Firebase 資料庫！</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="statsModal" onclick="closeStatsModal()" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="glass-panel p-6 rounded-2xl max-w-md w-full mx-4 space-y-4" onclick="event.stopPropagation()">
            <div class="flex items-center justify-between border-b border-white/5 pb-3">
                <div class="flex items-center gap-2 text-purple-400">
                    <i id="statsModalIcon" data-lucide="bar-chart-2" class="w-5 h-5"></i>
                    <h3 id="statsModalTitle" class="text-base font-bold text-white">數據 analysis 排行</h3>
                </div>
                <button onclick="closeStatsModal()" class="text-gray-400 hover:text-white transition">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="statsRankList" class="space-y-2.5 max-h-[60vh] overflow-y-auto pr-1"></div>
        </div>
    </div>

    <div id="deleteModal" onclick="closeDeleteModal()" class="fixed inset-0 z-50 flex items-center justify-center bg-black/80 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300">
        <div class="glass-panel p-6 rounded-2xl max-w-sm w-full mx-4 space-y-4 border border-red-500/20" onclick="event.stopPropagation()">
            <div class="flex items-center gap-3 text-red-400">
                <div class="p-2 bg-red-500/10 rounded-lg"><i data-lucide="alert-triangle" class="w-6 h-6"></i></div>
                <h3 class="text-base font-bold text-white">確定要刪除這筆紀錄嗎？</h3>
            </div>
            <p class="text-xs text-gray-400 leading-relaxed">你將從雲端資料庫移除此紀錄 <span id="deleteTargetName" class="text-white font-bold"></span>，此動作無法復原。</p>
            <div class="flex gap-2 justify-end pt-2">
                <button onclick="closeDeleteModal()" class="px-4 py-2 bg-white/5 hover:bg-white/10 text-gray-300 rounded-xl text-xs transition">保留</button>
                <button id="confirmDeleteBtn" class="px-4 py-2 bg-red-600 hover:bg-red-500 text-white rounded-xl text-xs transition font-semibold">確定刪除</button>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="fixed bottom-6 right-6 z-50 space-y-2"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        // Firebase 金鑰配置資訊
        const firebaseConfig = {
              apiKey: "AIzaSyBuXhWGyzb8GeQhAxysr4mN2tE5ckewAxw",
              authDomain: "concerts-6ced3.firebaseapp.com",
              projectId: "concerts-6ced3",
              storageBucket: "concerts-6ced3.firebasestorage.app",
              messagingSenderId: "160426573663",
              appId: "1:160426573663:web:e8785f1a0f1ca354ae00ea",
              measurementId: "G-V5VMQWBKCJ"
        };
		
        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        signInAnonymously(auth)
          .then(() => console.log("已自動匿名登入，獲得雲端寫入權限！"))
          .catch((error) => console.error("登入失敗：", error));

        // 全域變數
        let concerts = [];
        let deleteTargetId = null;
        let currentBase64Image = ""; // 存放壓縮後的圖片字串

        // 監聽 Firebase 雲端資料庫即時變動
        onSnapshot(collection(db, "concerts"), (snapshot) => {
            concerts = [];
            snapshot.forEach((doc) => {
                concerts.push({ id: doc.id, ...doc.data() });
            });
            filterAndRender();
        }, (error) => {
            showToast('資料同步失敗，請檢查 Firebase 配置與規則！', 'error');
        });

        // 16:9 預設幾何海報生成
        function generateDefaultPoster(name, date) {
            const colors = [['#3b82f6', '#8b5cf6'], ['#ec4899', '#f43f5e'], ['#a855f7', '#ec4899'], ['#06b6d4', '#3b82f6']];
            const codeSum = name.split('').reduce((acc, char) => acc + char.charCodeAt(0), 0);
            const selectedColor = colors[codeSum % colors.length];
            return `data:image/svg+xml;utf8,<svg width="640" height="360" viewBox="0 0 640 360" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="${selectedColor[0]}"/><stop offset="100%" stop-color="${selectedColor[1]}"/></linearGradient></defs><rect width="640" height="360" fill="url(%23g)"/><circle cx="480" cy="180" r="120" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="4"/><circle cx="480" cy="180" r="80" fill="rgba(0,0,0,0.2)"/><circle cx="480" cy="180" r="15" fill="%23fff"/><g transform="translate(40, 180)" fill="%23ffffff"><text font-family="system-ui, sans-serif" font-weight="900" font-size="28" y="0">${escapeSvg(name.substring(0, 20))}</text><text font-family="system-ui, sans-serif" font-weight="700" font-size="14" y="32" opacity="0.6">LIVE ARCHIVE COLLECTOR</text><text font-family="system-ui, sans-serif" font-weight="400" font-size="12" y="55" opacity="0.5">${date}</text></g></svg>`;
        }

        function escapeSvg(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&apos;");
        }

        // 核心智慧壓縮功能 (維持比例、自動控制在安全容量內)
        function compressImage(file, maxWidth = 1000, quality = 0.7) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function (e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function () {
                        let width = img.width;
                        let height = img.height;

                        if (width > maxWidth) {
                            height = Math.round((height * maxWidth) / width);
                            width = maxWidth;
                        }

                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;

                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);

                        const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
                        resolve(compressedBase64);
                    };
                    img.onerror = reject;
                };
                reader.onerror = reject;
            });
        }

        // 選擇圖片事件：加入非同步智慧縮放與壓縮
        window.previewImage = async function(event) {
            const file = event.target.files[0];
            const preview = document.getElementById('imagePreview');
            const placeholder = document.getElementById('imagePlaceholder');
            
            if (file) {
                if (file.size > 200 * 1024) { // 檔案大於 200KB 啟動本機壓縮
                    console.log(`原始圖檔較大 (${(file.size/1024).toFixed(1)} KB)，啟動等比例壓縮...`);
                    try {
                        currentBase64Image = await compressImage(file, 1000, 0.7);
                    } catch (error) {
                        console.error("壓縮失敗，退回原圖處理：", error);
                        const reader = new FileReader();
                        reader.onload = (e) => { currentBase64Image = e.target.result; preview.src = currentBase64Image; };
                        reader.readAsDataURL(file);
                        return;
                    }
                } else {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        currentBase64Image = e.target.result;
                        preview.src = currentBase64Image;
                    }
                    reader.readAsDataURL(file);
                }

                setTimeout(() => {
                    preview.src = currentBase64Image;
                    preview.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                }, 50);
            }
        }

        // 新增與更新處理 (完全脫離 Storage，改存安全體積的 Base64 字串)
        window.handleFormSubmit = async function(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const editId = document.getElementById('editId').value;
            const name = document.getElementById('name').value.trim();
            const date = document.getElementById('date').value;
            const price = parseInt(document.getElementById('price').value) || 0;
            const artist = document.getElementById('artist').value.trim();
            const venue = document.getElementById('venue').value.trim();
            const existingImage = document.getElementById('existingImage').value;

            submitBtn.disabled = true;
            submitBtn.innerHTML = `<span class="animate-spin inline-block w-4 h-4 border-2 border-white border-t-transparent rounded-full mr-2"></span> 雲端處理中...`;

            try {
                // 如果有新壓縮的圖片就用新的，沒有就沿用舊的
                let finalImageUrl = currentBase64Image ? currentBase64Image : existingImage;

                const payload = { name, date, price, artist, venue, image: finalImageUrl };

                if (editId) {
                    await updateDoc(doc(db, "concerts", editId), payload);
                    showToast('已成功更新雲端紀錄', 'success');
                } else {
                    await addDoc(collection(db, "concerts"), payload);
                    showToast('已成功儲存至雲端資料庫', 'success');
                }
                resetForm();
            } catch (error) {
                console.error(error);
                showToast('處理失敗，請檢查雲端規則設定！', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `儲存紀錄`;
            }
        }

        // 編輯載入
        window.startEdit = function(id) {
            const concert = concerts.find(c => c.id === id);
            if (!concert) return;

            window.scrollTo({ top: 0, behavior: 'smooth' });

            document.getElementById('editId').value = concert.id;
            document.getElementById('name').value = concert.name;
            document.getElementById('date').value = concert.date;
            document.getElementById('price').value = concert.price;
            document.getElementById('artist').value = concert.artist;
            document.getElementById('venue').value = concert.venue;
            document.getElementById('existingImage').value = concert.image;
            currentBase64Image = ""; // 清空暫存，避免污染

            const preview = document.getElementById('imagePreview');
            const placeholder = document.getElementById('imagePlaceholder');
            
            if (concert.image) {
                preview.src = concert.image;
                preview.classList.remove('hidden');
                placeholder.classList.add('hidden');
            } else {
                preview.classList.add('hidden');
                placeholder.classList.remove('hidden');
            }

            document.getElementById('formTitle').textContent = '編輯紀錄資訊';
            document.getElementById('formIcon').setAttribute('data-lucide', 'edit-3');
            document.getElementById('submitBtn').textContent = '更新雲端紀錄';
            document.getElementById('cancelBtn').classList.remove('hidden');
            lucide.createIcons();
        }

        // 刪除處理
        window.askDelete = function(id) {
            deleteTargetId = id;
            const concert = concerts.find(c => c.id === id);
            if (!concert) return;
            
            document.getElementById('deleteTargetName').textContent = `「${concert.name}」`;
            const modal = document.getElementById('deleteModal');
            modal.classList.remove('opacity-0', 'pointer-events-none');
        }

        window.closeDeleteModal = function() {
            document.getElementById('deleteModal').classList.add('opacity-0', 'pointer-events-none');
            deleteTargetId = null;
        }

        document.getElementById('confirmDeleteBtn').addEventListener('click', async () => {
            if (deleteTargetId) {
                try {
                    await deleteDoc(doc(db, "concerts", deleteTargetId));
                    showToast('已從雲端刪除該項目', 'success');
                } catch (e) {
                    showToast('刪除失敗', 'error');
                }
            }
            closeDeleteModal();
        });

        // 重設表單
        window.resetForm = function() {
            document.getElementById('concertForm').reset();
            document.getElementById('editId').value = '';
            document.getElementById('existingImage').value = '';
            document.getElementById('imagePreview').classList.add('hidden');
            document.getElementById('imagePlaceholder').classList.remove('hidden');
            document.getElementById('imageInput').value = '';
            currentBase64Image = ""; 

            document.getElementById('formTitle').textContent = '新增演唱會紀錄';
            document.getElementById('formIcon').setAttribute('data-lucide', 'plus-circle');
            document.getElementById('submitBtn').textContent = '儲存紀錄';
            document.getElementById('cancelBtn').classList.add('hidden');
            lucide.createIcons();
        }

        // 排序與渲染 (16:9 橫向排版)
        window.filterAndRender = function() {
            const searchQuery = document.getElementById('searchInput').value.toLowerCase().trim();
            const sortBy = document.getElementById('sortSelect').value;

            let filtered = concerts.filter(c => {
                return c.name.toLowerCase().includes(searchQuery) || 
                       c.artist.toLowerCase().includes(searchQuery) || 
                       c.venue.toLowerCase().includes(searchQuery);
            });

            filtered.sort((a, b) => {
                if (sortBy === 'date-desc') return new Date(b.date) - new Date(a.date);
                if (sortBy === 'date-asc') return new Date(a.date) - new Date(b.date);
                if (sortBy === 'price-desc') return b.price - a.price;
                if (sortBy === 'price-asc') return a.price - b.price;
                return 0;
            });

            const wall = document.getElementById('concertWall');
            const emptyState = document.getElementById('emptyState');
            wall.innerHTML = '';

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                filtered.forEach(item => {
                    const posterSrc = item.image || generateDefaultPoster(item.name, item.date);
                    
                    const card = document.createElement('div');
                    card.className = 'glass-panel rounded-2xl overflow-hidden hover:border-purple-500/30 transition-all duration-300 flex flex-col md:flex-row group';
                    
                    card.innerHTML = `
                        <div class="relative aspect-[16/9] md:w-2/5 bg-black/60 overflow-hidden shrink-0">
                            <img src="${posterSrc}" alt="${item.name} 海報" class="w-full h-full object-cover group-hover:scale-102 transition-transform duration-500">
                        </div>
                        <div class="p-5 flex-1 flex flex-col justify-between">
                            <div class="space-y-2">
                                <div class="flex justify-between items-center">
                                    <span class="text-[11px] font-mono tracking-wider text-purple-400 bg-purple-500/10 px-2.5 py-0.5 rounded-md">${item.date}</span>
                                    <span class="text-xs font-bold text-pink-400 font-mono bg-pink-500/5 px-2.5 py-0.5 rounded-md">NT$ ${item.price.toLocaleString()}</span>
                                </div>
                                <h3 class="font-bold text-base text-gray-100 group-hover:text-purple-300 transition pt-1 line-clamp-1">${item.name}</h3>
                            </div>
                            <div class="pt-4 border-t border-white/5 mt-4 flex justify-between items-center text-xs text-gray-400">
                                <span class="flex items-center gap-1.5 truncate max-w-[75%]">
                                    <i data-lucide="map-pin" class="w-4 h-4 text-gray-500 shrink-0"></i>
                                    <strong class="text-purple-400 font-medium shrink-0">[${item.artist}]</strong> 
                                    <span class="truncate">${item.venue}</span>
                                </span>
                                <div class="flex gap-3">
                                    <button onclick="startEdit('${item.id}')" class="text-purple-400 hover:text-purple-300 font-semibold transition">編輯</button>
                                    <button onclick="askDelete('${item.id}')" class="text-red-400 hover:text-red-300 transition">刪除</button>
                                </div>
                            </div>
                        </div>
                    `;
                    wall.appendChild(card);
                });
            }

            updateStatsContainers();
            lucide.createIcons();
        }

        // 更新頂部看板數字
        function updateStatsContainers() {
            const count = concerts.length;
            const spent = concerts.reduce((sum, item) => sum + item.price, 0);
            const venuesCount = new Set(concerts.map(c => c.venue.trim().toLowerCase())).size;

            document.getElementById('statCount').innerHTML = `${count} <span class="text-sm text-gray-400 font-normal">場</span>`;
            document.getElementById('statSpent').textContent = `NT$ ${spent.toLocaleString()}`;
            document.getElementById('statVenues').innerHTML = `${venuesCount} <span class="text-sm text-gray-400 font-normal">個</span>`;
        }

        // 彈出排行榜視窗
        window.openStatsModal = function(type) {
            const modal = document.getElementById('statsModal');
            const title = document.getElementById('statsModalTitle');
            const icon = document.getElementById('statsModalIcon');
            const listContainer = document.getElementById('statsRankList');
            
            listContainer.innerHTML = '';
            
            if (type === 'artist') {
                title.textContent = '熱門參戰藝人排行';
                icon.setAttribute('data-lucide', 'users');
                let counts = {};
                concerts.forEach(c => { if(c.artist) counts[c.artist] = (counts[c.artist] || 0) + 1; });
                let sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
                if(sorted.length === 0) listContainer.innerHTML = `<p class="text-xs text-gray-500 py-4 text-center">暫無數據</p>`;
                sorted.forEach(([artist, count], index) => {
                    listContainer.appendChild(createRankItemHTML(index, artist, `${count} 場`, 'text-purple-400'));
                });
            } 
            else if (type === 'price') {
                title.textContent = '門票花費最高排行';
                icon.setAttribute('data-lucide', 'banknote');
                let sorted = [...concerts].sort((a, b) => b.price - a.price);
                if(sorted.length === 0) listContainer.innerHTML = `<p class="text-xs text-gray-500 py-4 text-center">暫無數據</p>`;
                sorted.forEach((item, index) => {
                    const desc = `[${item.artist}] ${item.venue}`;
                    listContainer.appendChild(createRankItemHTML(index, item.name, `NT$ ${item.price.toLocaleString()}`, 'text-pink-400', desc));
                });
            } 
            else if (type === 'venue') {
                title.textContent = '解鎖場地造訪排行';
                icon.setAttribute('data-lucide', 'map-pin');
                let counts = {};
                concerts.forEach(c => { if(c.venue) counts[c.venue] = (counts[c.venue] || 0) + 1; });
                let sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
                if(sorted.length === 0) listContainer.innerHTML = `<p class="text-xs text-gray-500 py-4 text-center">暫無數據</p>`;
                sorted.forEach(([venue, count], index) => {
                    listContainer.appendChild(createRankItemHTML(index, venue, `${count} 次`, 'text-emerald-400'));
                });
            }

            modal.classList.remove('opacity-0', 'pointer-events-none');
            lucide.createIcons();
        }

        function createRankItemHTML(index, title, value, valColorClass, subtitle = '') {
            const medals = ['🥇', '🥈', '🥉'];
            const medal = index < 3 ? `<span class="text-lg">${medals[index]}</span>` : `<span class="w-5 text-center text-xs font-mono text-gray-500">${index + 1}</span>`;
            
            const div = document.createElement('div');
            div.className = 'flex items-center justify-between p-3 bg-black/30 border border-white/5 rounded-xl';
            div.innerHTML = `
                <div class="flex items-center gap-3 truncate pr-2">
                    ${medal}
                    <div class="truncate">
                        <p class="text-xs font-bold text-gray-200 truncate">${title}</p>
                        ${subtitle ? `<p class="text-[10px] text-gray-500 truncate mt-0.5">${subtitle}</p>` : ''}
                    </div>
                </div>
                <span class="text-xs font-bold font-mono ${valColorClass} shrink-0">${value}</span>
            `;
            return div;
        }

        window.closeStatsModal = function() {
            document.getElementById('statsModal').classList.add('opacity-0', 'pointer-events-none');
        }

        // 訊息通知
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `flex items-center gap-2 px-4 py-3 rounded-xl shadow-2xl border transition-all duration-300 transform translate-y-2 opacity-0 text-sm font-medium ${
                type === 'success' ? 'bg-purple-950/80 text-purple-200 border-purple-500/30' : 'bg-red-950/80 text-red-200 border-red-500/30'
            }`;
            const icon = type === 'success' ? 'check-circle' : 'alert-circle';
            toast.innerHTML = `<i data-lucide="${icon}" class="w-4 h-4 shrink-0"></i> <span>${message}</span>`;
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-1');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
